syntax = "proto3";

package bayesmech.vision;

option java_multiple_files = true;
option java_package = "com.bayesmech.vision";

import "perceiver.proto";

// On disk, one recording-level .vggt.pb file contains a length-delimited
// stream of VggtInferenceResponse records. Each record is one computed frame
// set; consumers merge records by frame_identifier.frame_number.

message VggtInferenceRequest {
  string request_id = 1;
  string source_recording_path = 2;
  string marker_start = 3;
  string marker_end = 4;
  uint32 start_frame_index = 5;
  uint32 end_frame_index = 6;
  repeated PerceiverFrameIdentifier frame_identifiers = 7;
  uint32 resolution = 8;
  float confidence_threshold = 9;
  uint32 max_points_per_frame = 10;
}

message VggtCameraFrame {
  PerceiverFrameIdentifier frame_identifier = 1;
  uint32 source_frame_index = 2;
  uint32 sampled_frame_index = 3;
  repeated float extrinsics_cfw = 4 [packed = true];
  repeated float intrinsics = 5 [packed = true];
  repeated float camera_to_world = 6 [packed = true];
  repeated float camera_center = 7 [packed = true];
}

message VggtPointCloudFrame {
  PerceiverFrameIdentifier frame_identifier = 1;
  uint32 source_frame_index = 2;
  uint32 sampled_frame_index = 3;
  uint32 point_count = 4;
  uint32 returned_point_count = 5;
  bytes xyz_f32_le = 6;
  bytes rgb_f32_le = 7;
  bytes uv_f32_le = 8;
  bytes confidence_f32_le = 9;
  uint32 image_width = 10;
  uint32 image_height = 11;
}

message VggtGaussianSplatPreviewPoint {
  float x = 1;
  float y = 2;
  float z = 3;
  float r = 4;
  float g = 5;
  float b = 6;
  float opacity = 7;
  float scale = 8;  // isotropic mean std dev (back-compat / fallback)
  // Anisotropic Gaussian: per-axis linear std devs and orientation quaternion.
  // When present, viewers render a true oriented ellipsoid; when absent they
  // fall back to an isotropic Gaussian of radius `scale`.
  float scale_x = 9;
  float scale_y = 10;
  float scale_z = 11;
  float rot_x = 12;
  float rot_y = 13;
  float rot_z = 14;
  float rot_w = 15;
}

message VggtGaussianSplat {
  string status = 1;
  string ply_path = 2;
  string preview_json_path = 3;
  string error = 4;
  uint32 gaussian_count = 5;
  uint32 preview_point_count = 6;
  uint32 init_point_count = 7;
  uint32 training_frame_count = 8;
  uint32 max_steps = 9;
  uint32 max_gaussians = 10;
  float elapsed_sec = 11;
  string trainer = 12;
  string job_id = 13;
  string stage = 14;
  string message = 15;
  float progress = 16;
  uint32 current_step = 17;
  repeated VggtGaussianSplatPreviewPoint preview_points = 18;
}

message VggtInferenceResponse {
  string request_id = 1;
  string model = 2;
  string checkpoint = 3;
  string device = 4;
  string source_recording_path = 5;
  string marker_start = 6;
  string marker_end = 7;
  uint32 start_frame_index = 8;
  uint32 end_frame_index = 9;
  uint32 frame_count = 10;
  repeated VggtCameraFrame cameras = 11;
  repeated VggtPointCloudFrame point_clouds = 12;
  string camera_convention = 13;
  string pointcloud_space = 14;
  float elapsed_sec = 15;
  string endpoint = 16;
  VggtGaussianSplat gaussian_splat = 17;
  uint32 resolution = 18;
  string preprocess_mode = 19;
  float confidence_threshold = 20;
  uint32 max_points_per_frame = 21;
}
