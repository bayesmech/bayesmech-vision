syntax = "proto3";

package bayesmech.vision;

option java_multiple_files = true;
option java_package = "com.bayesmech.vision";

import "perceiver.proto";
import "primitives.proto";

message IdoSlamFramePose {
  PerceiverFrameIdentifier frame_id = 1;
  uint32 frame_index = 2;

  // Camera pose in the SLAM world frame.
  Pose world_pose = 3;

  // Euler angles in degrees packed into a Vector3:
  // x=pitch, y=roll, z=yaw.
  Vector3 euler_degrees = 4;
}

message IdoSlamGroundPoint {
  uint32 frame_index = 1;
  uint32 paired_frame_index = 2;

  // Triangulated point in the SLAM world frame.
  Vector3 point = 3;

  // Optional label for which side of the road corridor the point belongs to.
  string side = 4;
}

message IdoSlamPointCorrespondence {
  float source_x = 1;
  float source_y = 2;
  float target_x = 3;
  float target_y = 4;

  // Triangulated point associated with this image correspondence.
  Vector3 world_point = 5;

  string side = 6;
  bool on_road = 7;
  bool triangulated = 8;
  bool inlier = 9;
}

message IdoSlamPairDebug {
  uint32 frame_index = 1;
  uint32 paired_frame_index = 2;
  string status = 3;
  uint32 good_match_count = 4;
  uint32 inlier_count = 5;
  uint32 triangulated_left = 6;
  uint32 triangulated_right = 7;
  uint32 on_road_count = 8;
  repeated IdoSlamPointCorrespondence correspondences = 9;
}

message IdoSlamPairwiseMotion {
  uint32 prev_frame_index = 1;
  uint32 frame_index = 2;
  uint64 prev_timestamp_ns = 3;
  uint64 timestamp_ns = 4;
  string status = 5;
  uint32 keypoints_prev = 6;
  uint32 keypoints = 7;
  uint32 good_match_count = 8;
  uint32 essential_inlier_count = 9;
  float essential_inlier_ratio = 10;
  float translation_magnitude = 11;
  float rotation_deg = 12;
  float dx = 13;
  float dy = 14;
  float dz = 15;
  float qx = 16;
  float qy = 17;
  float qz = 18;
  float qw = 19;
  uint32 mask_pixels_prev = 20;
  uint32 mask_pixels = 21;
}

message IdoSlamTrackWidthEstimate {
  uint32 frame_index = 1;
  uint32 frame_number = 2;
  uint64 timestamp_ns = 3;
  double latitude = 4;
  double longitude = 5;
  double width_m = 6;
  double left_offset_m = 7;
  double right_offset_m = 8;
  double bike_fraction = 9;
  string method = 10;
}

message IdoSlamCanonicalCenterlinePoint {
  uint32 bin_index = 1;
  double progress_m = 2;
  double center_x = 3;
  double center_y = 4;
  double width_m = 5;
  double left_x = 6;
  double left_y = 7;
  double right_x = 8;
  double right_y = 9;
}

message IdoSlamCanonicalFrameTrack {
  uint32 frame_index = 1;
  uint32 frame_number = 2;
  uint64 timestamp_ns = 3;
  int32 lap_id = 4;
  bool is_partial_lap = 5;
  double progress_m = 6;
  double progress_fraction = 7;
  double gps_x = 8;
  double gps_y = 9;
  double canonical_x = 10;
  double canonical_y = 11;
  double lateral_offset_m = 12;
  double image_lateral_m = 13;
  bool has_image_lateral_m = 14;
  double trajectory_lateral_m = 15;
  double trajectory_x = 16;
  double trajectory_y = 17;
  double width_m = 18;
  double half_width_m = 19;
}

message IdoSlamResponse {
  PerceiverFrameIdentifier first_frame_id = 1;
  string recording_path = 2;
  string segmentation_path = 3;
  string workspace_path = 4;

  // Pre-GPS-refinement visual odometry poses.
  repeated IdoSlamFramePose frame_poses = 5;
  repeated IdoSlamGroundPoint ground_points = 6;
  repeated IdoSlamPairDebug pair_debug = 7;
  // Post-GPS-refinement poses, when refinement is enabled and accepted.
  repeated IdoSlamFramePose refined_frame_poses = 8;
  repeated IdoSlamPairwiseMotion pairwise_motion = 9;

  // Derived road-width/canonical-track artifacts needed to re-render debug
  // videos after hydrating a workspace from this checkpoint.
  repeated IdoSlamTrackWidthEstimate plane_width_estimates = 10;
  string plane_width_summary_json = 11;
  repeated IdoSlamCanonicalCenterlinePoint canonical_centerline = 12;
  repeated IdoSlamCanonicalFrameTrack canonical_frame_tracks = 13;
  string canonical_summary_json = 14;
  repeated IdoSlamTrackWidthEstimate triangulated_width_estimates = 15;
  string triangulated_summary_json = 16;
}
