syntax = "proto3";

package bayesmech.vision;

option java_multiple_files = true;
option java_package = "com.bayesmech.vision";

import "perceiver.proto";

// Summary record written to <name>.recon.pb after a reconstruction run.
message ReconstructionResponse {

  // ── Source recording metadata ──────────────────────────────────────────
  // Frame identifier from the first frame of the recording used.
  PerceiverFrameIdentifier frame_identifier = 1;

  // ── Sparse reconstruction (COLMAP SfM) ────────────────────────────────
  // Number of images successfully registered by COLMAP.
  uint32 num_registered_images = 2;

  // Total images submitted to COLMAP (registered + unregistered).
  uint32 num_total_images = 3;

  // Number of 3D points in the sparse model.
  uint32 num_sparse_points = 4;

  // Mean reprojection error of the sparse model (pixels).
  float mean_reprojection_error = 5;

  // Path to the COLMAP workspace directory (relative to the recording dir).
  string workspace_path = 6;

  // ── Dense MVS (optional) ──────────────────────────────────────────────
  uint32 num_dense_points = 7;

  // Path to the dense fused.ply point cloud (relative to workspace_path).
  string dense_ply_path = 8;

  // ── Gaussian Splatting (optional) ─────────────────────────────────────
  uint32 num_gaussians = 9;

  uint32 training_steps = 10;

  // Path to the exported .ply Gaussian model (relative to recording dir).
  string splat_ply_path = 11;

  // ── Pipeline metadata ──────────────────────────────────────────────────
  float total_runtime_seconds = 12;

  // Frames extracted from the recording for this run.
  uint32 frames_extracted = 13;

  // Sampling interval used (every Nth frame from the recording).
  uint32 sample_every = 14;

  // Snapshot of the config YAML used for this run.
  string config_yaml = 15;
}
