# Reconstruction pipeline configuration

# ── Pipeline control ──────────────────────────────────────────────────────────
pipeline:
  # Extract frames from .vis.pb and run COLMAP SfM
  # Set to false to reuse an existing <name>.recon/ workspace
  run_colmap: true

  # Run Gaussian Splatting training after COLMAP succeeds
  run_gaussian_splatting: true

  # Run dense MVS (patch_match_stereo + stereo_fusion) before 3DGS
  # Requires 'colmap' binary on PATH with GPU support compiled in
  run_dense_mvs: false

  # Path to COLMAP binary (used for dense MVS only, optional)
  colmap_binary: "colmap"

# ── Frame extraction ─────────────────────────────────────────────────────────
extraction:
  # Use every Nth frame. 1 = all frames (30fps is usually too dense for SfM)
  # 5 → ~6fps, 10 → ~3fps, 15 → ~2fps
  sample_every: 5

  # Limit total frames processed (0 = no limit). Useful for quick tests.
  max_frames: 0

  # JPEG quality for saved images (higher = larger files, better COLMAP features)
  image_quality: 95

# ── COLMAP SfM ───────────────────────────────────────────────────────────────
colmap:
  # Camera model — PINHOLE matches ARCore (fx, fy, cx, cy)
  # SIMPLE_RADIAL adds one radial distortion term if quality is poor
  camera_model: "PINHOLE"

  # Share one camera model for all images (true = faster, assumes fixed intrinsics)
  # Set false if the recording covers very different zoom levels
  single_camera: true

  # Feature extraction
  feature_extraction:
    max_image_size: 1600        # Longest edge limit for feature extraction
    max_num_features: 8192

  # Matching strategy: "sequential" is best for video (adjacent frames)
  # "exhaustive" more robust but O(n²) — use only for short clips
  matcher: "sequential"
  sequential_overlap: 10        # Number of adjacent frames to match per frame

  # Incremental mapper (SfM)
  mapper:
    min_num_matches: 15
    init_min_num_inliers: 50
    abs_pose_min_num_inliers: 30
    abs_pose_min_inlier_ratio: 0.2

# ── Dense MVS (optional) ────────────────────────────────────────────────────
dense_mvs:
  patch_match:
    max_image_size: 1000
    window_radius: 5
    gpu_index: "0"
  fusion:
    min_num_pixels: 3
    max_reproj_error: 2.0

# ── Gaussian Splatting ───────────────────────────────────────────────────────
gaussian_splatting:
  # Downsample images by this factor during training (1=full, 2=half, 4=quarter)
  # 1 = full resolution; use 2 or 4 only on GPUs with < 8 GB VRAM
  data_factor: 1

  # Training iterations (7000 is fast preview, 30000 is full quality)
  max_steps: 30000

  # MCMC caps the number of Gaussians — increase freely on large GPUs
  mcmc_max_gaussians: 6000000

  # Spherical harmonics degree (0=colour only, 3=full view-dependent colour)
  sh_degree: 3

  # Save .ply checkpoint every N steps (0 = only at the end)
  save_every_n_steps: 0
