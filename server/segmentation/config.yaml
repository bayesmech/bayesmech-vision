# Segmentation configuration for main.py.

sam3:
  dtype: "bfloat16"         # Use "float32" if bfloat16 is unsupported or unstable.
  inference_height: 360     # Downsample frames to this height before inference.
                             # Set to null to use the original frame resolution.
  max_num_objects: 8        # Cap simultaneous tracked objects to keep VRAM bounded.
  session_reset_frames: 100 # Recreate the SAM3 tracking session periodically to
                            # avoid steady VRAM growth on long recordings.
                            # Set to null or 0 to disable resets.

id_stability:
  iou_threshold: 0.7 # Same-label masks above this filled-mask IoU keep ID after reset.

sampling:
  sample_every_x_frames: 1  # Emit annotations for every Nth frame.
