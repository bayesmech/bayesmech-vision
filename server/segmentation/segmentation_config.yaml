# Segmentation configuration for main.py
# See README.md for usage instructions.

model:
  sam3:
    dtype: "float32"
    inference_height: null  # No downsampling — run at full resolution
    tracker:
      # Behavioral overrides applied to Sam3VideoConfig after loading pretrained weights.
      # These only change thresholds/caps, not model architecture, so weights load fine.
      max_num_objects: 100          # Hard cap on simultaneously tracked objects (default: 10000)
      score_threshold_detection: 0.5    # Min detector confidence (default: 0.5)
      new_det_thresh: 0.5              # Min confidence to start a new track (default: 0.7)
      hotstart_delay: 5                # Frames to buffer before committing a track (default: 15)
      hotstart_unmatch_thresh: 3       # Unmatched frames before pruning a hotstart track (default: 8)
      init_trk_keep_alive: 10          # Keep-alive counter for new tracks (default: 30)
      max_trk_keep_alive: 15           # Max keep-alive counter (default: 30)
      session_reset_frames: 2000        # Reinitialize tracking session every N frames

sampling:
  sample_every_x_frames: 1  # Emit annotations for every Nth frame (1 = every frame)
                             # Both models always process every frame for tracking continuity;
                             # only the output is subsampled.
