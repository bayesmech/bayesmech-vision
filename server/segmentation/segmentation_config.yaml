# Segmentation configuration for main.py
# See README.md for usage instructions.

model:
  sam3:
    dtype: "bfloat16"       # Required for 6 GB VRAM; use "float32" if you have >=8 GB
    inference_height: 360   # Downsample frames to this height before SAM3 inference
                            # (width computed to preserve aspect ratio)
                            # Use null to keep original resolution

sampling:
  sample_every_x_frames: 1  # Emit annotations for every Nth frame (1 = every frame)
                             # Both models always process every frame for tracking continuity;
                             # only the output is subsampled.
