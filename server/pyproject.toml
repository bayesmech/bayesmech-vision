[project]
name = "bayesmech_vision"
version = "0.1.0"
description = "BayesMech Vision - AR Stream Server with SAM3 Video Segmentation"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",
    "websockets>=13.0",
    # Serialization
    "protobuf==7.34.1",
    # Image processing
    "Pillow==10.2.0",
    "opencv-python>=4.9.0",
    # Array operations and ML
    "numpy==1.26.3",
    "torch==2.7.0",
    "torchvision>=0.22.0",
    "torchaudio>=2.7.0",
    # SAM3 via HuggingFace Transformers (text-concept segmentation)
    "transformers>=4.50.0",
    "huggingface_hub>=0.27.0",
    "matplotlib>=3.8.0",
    "scikit-learn>=1.4.0",
    # "kernels",
    # Configuration
    "pyyaml==6.0.1",
    # Utilities
    "python-multipart==0.0.6",
    "aiohttp>=3.13.3",
    # Gemini video analysis + MCP
    "google-genai>=0.8.0",
    "fastmcp>=2.0.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    # 3D reconstruction (COLMAP bridge)
    "pycolmap>=0.4.0",
    "gsplat",
    "plyfile",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["server", "segmentation"]

[tool.uv]
index-url = "https://download.pytorch.org/whl/cu126"
extra-index-url = [
    "https://pypi.org/simple",
    "https://docs.gsplat.studio/whl/pt27cu126",
]
