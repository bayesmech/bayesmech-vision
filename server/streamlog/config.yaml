listeners:
  - name: streamlog
    bind_host: "0.0.0.0"
    bind_port: 8080
    base_url: "http://localhost:8080/streamlog"
    base_path: "/streamlog"
    planes: [Outstream, Instream, Insightgen, Analyzers]

recordings_root: "recordings"
logs_root: "logs"
dashboard_static_root: "analysis/dashboard/dist"
enabled_planes: [Outstream, Instream, Insightgen, Analyzers]

limits:
  max_record_size: 536870912
  max_outstream_range_frames: 240
  max_outstream_response_bytes: 268435456
  max_upload_size: 8589934592
  max_upload_chunk_size: 134217728
  max_transcription_upload_size: 52428800

media:
  jpeg_quality: 75
  max_width: 480
  overlay_alpha: 0.5
  motion_tail_length: 30
  highlights_only: true
