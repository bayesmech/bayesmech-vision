server:
  host: "0.0.0.0"
  port: 8080
  max_connections: 5

buffer:
  max_frames_per_client: 60  # Keep last 60 frames (~2-4 seconds at 15-30 FPS)

devices:
  # The sister robot-control firmware defaults are registered out of the box.
  # For a shared LAN, change these URLs here, set the ROBOCAR_* environment
  # variables, or add/update robots from the Control tab. Add more entries for
  # additional cars; phone streams register themselves by Perceiver device_id.
  robots:
    - id: "robocar-1"
      name: "Robocar 1"
      controller_url: "http://192.168.4.1"
      camera_url: "http://192.168.4.2"
      camera_stream_url: "http://192.168.4.2:81/stream"
  request_timeout_seconds: 2.0
  connect_timeout_seconds: 1.0
  ultrasonic_poll_seconds: 0.12
  status_poll_seconds: 1.0
  camera_poll_seconds: 3.0

segmentation:
  host: "http://127.0.0.1:8081"

insightgen:
  video:
    highlights_only: true     # Send only scene_emphasis windows; false = full recording
    jpeg_quality: 75          # JPEG encoding quality for rendered frames (0-100)
    max_width: 480            # Downscale frames to this width before encoding (0 = no limit)
    overlay_alpha: 0.5        # Heatmap blend weight for the understanding layer
    tail_length: 30           # Motioncap track tail length in frames
