services:
  # ── Live server ─────────────────────────────────────────────────────────────
  # Runs continuously; started with: docker-compose up streamlog
  streamlog:
    build:
      context: ..
      dockerfile: docker/streamlog/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ../recordings:/app/recordings
    env_file: ../.env
    restart: unless-stopped

  # ── Batch analyzers (GPU) ────────────────────────────────────────────────────
  # One-shot jobs; NOT started by default (profiles: batch).
  # Usage: docker-compose run --rm <service> /app/.venv/bin/python server/<module>/main.py recordings/foo.vis.pb [args]
  #
  # Examples:
  #   docker-compose run --rm segmentation \
  #     /app/.venv/bin/python server/segmentation/main.py recordings/foo.vis.pb --text "person"
  #
  #   docker-compose run --rm motioncap \
  #     /app/.venv/bin/python server/motioncap/main.py recordings/foo.vis.pb --output-video
  #
  #   docker-compose run --rm genspark \
  #     /app/.venv/bin/python server/genspark/main.py recordings/foo.vis.pb --provider gemini
  #
  #   docker-compose run --rm reconstruct \
  #     /app/.venv/bin/python server/reconstruct/main.py recordings/foo.vis.pb --no-splat

  segmentation:
    build:
      context: ..
      dockerfile: docker/serverjobs/Dockerfile
    volumes:
      - ../recordings:/app/recordings
    env_file: ../.env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles: ["batch"]

  motioncap:
    build:
      context: ..
      dockerfile: docker/serverjobs/Dockerfile
    volumes:
      - ../recordings:/app/recordings
    env_file: ../.env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles: ["batch"]

  genspark:
    build:
      context: ..
      dockerfile: docker/serverjobs/Dockerfile
    volumes:
      - ../recordings:/app/recordings
    env_file: ../.env
    profiles: ["batch"]

  reconstruct:
    build:
      context: ..
      dockerfile: docker/serverjobs/Dockerfile
    volumes:
      - ../recordings:/app/recordings
    env_file: ../.env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles: ["batch"]
